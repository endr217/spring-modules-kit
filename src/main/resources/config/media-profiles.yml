media:
  templates:
    default-images: &default-images
      - { name: thumb, width: 100, height: 100, format: webp }
      - { name: medium, width: 360, height: 360, format: webp }
      - { name: large, width: 800, height: 800, format: webp }
      - { name: extra_large, width: 1600, height: 1200, format: webp }

  # targetType -> collection -> conversions generated on upload
  profiles:
    Item:
      images: *default-images

    User:
      avatars:
        - name: thumb
          width: 120
          height: 120
          format: webp
        - name: medium
          width: 300
          height: 300
          format: webp
        - name: large
          width: 800
          height: 800
          format: webp
